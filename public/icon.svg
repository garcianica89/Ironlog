<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="170" fill="url(#glow)" />

  <!-- Dumbbell / Iron Icon -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)">
    <!-- Central Bar -->
    <rect x="156" y="240" width="200" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Grip knurling -->
    <line x1="216" y1="244" x2="216" y2="268" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="236" y1="244" x2="236" y2="268" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="244" x2="256" y2="268" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="276" y1="244" x2="276" y2="268" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="296" y1="244" x2="296" y2="268" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Plate Inner Collar -->
    <rect x="136" y="224" width="20" height="64" rx="4" fill="#94a3b8"/>
    <!-- Left Plate Main (Large) -->
    <rect x="100" y="160" width="36" height="192" rx="10" fill="url(#metal)"/>
    <!-- Left Plate Outer (Small) -->
    <rect x="72" y="184" width="28" height="144" rx="8" fill="#10b981"/>
    <!-- Left Collar Nut -->
    <rect x="54" y="236" width="18" height="40" rx="4" fill="#cbd5e1"/>

    <!-- Right Plate Inner Collar -->
    <rect x="356" y="224" width="20" height="64" rx="4" fill="#94a3b8"/>
    <!-- Right Plate Main (Large) -->
    <rect x="376" y="160" width="36" height="192" rx="10" fill="url(#metal)"/>
    <!-- Right Plate Outer (Small) -->
    <rect x="412" y="184" width="28" height="144" rx="8" fill="#10b981"/>
    <!-- Right Collar Nut -->
    <rect x="440" y="236" width="18" height="40" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Accent Energy Sparks / Iron Indicator -->
  <path d="M 230 420 L 260 400 L 250 430 L 282 390" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
